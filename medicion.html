<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>1930 — medición de páginas</title>
<style>
  :root{ --ink:#15171a; --muted:#565b66; --line:#e1e3e6; --surface:#fff; --accent:#00635d; }
  html,body{margin:0;height:100%;background:#f4f6f7;overflow:hidden;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink)}
  #stage{position:absolute;inset:0 0 120px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
  #frame{width:1920px;height:1000px;transform-origin:center center;position:relative;background:#fff}
  #frame img{display:block;width:100%;height:100%;object-fit:contain}
  #frame .pg{transform-origin:top left}
  #panel{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:0 1rem;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(21,23,26,.10);flex-wrap:wrap}
  .btn{height:52px;padding:0 1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 1rem 'Atkinson Hyperlegible',sans-serif;cursor:pointer}
  .btn:hover{background:#eef7f6}
  .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .sep{width:1px;height:40px;background:var(--line);margin:0 .3rem}
  #medida{min-width:330px;font:600 .95rem 'Atkinson Hyperlegible',sans-serif;color:var(--ink);line-height:1.35}
  #medida small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
  #nota{position:absolute;right:16px;top:12px;font:400 .85rem 'Atkinson Hyperlegible',sans-serif;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem;max-width:34ch}
</style>
</head>
<body>
<div id="stage"><div id="frame"></div></div>
<div id="nota">Prueba de rendimiento: la misma página como imagen o como HTML real. Los milisegundos van desde el toque hasta que la página está pintada.</div>
<div id="panel">
  <button class="btn" data-modo="imagen" aria-pressed="true">Imagen</button>
  <button class="btn" data-modo="flujo" aria-pressed="false">HTML</button>
  <span class="sep"></span>
  <button class="btn" data-pagina="0">Pág. 9</button>
  <button class="btn" data-pagina="1">Pág. 13</button>
  <button class="btn" data-pagina="2">Pág. 21</button>
  <span class="sep"></span>
  <button class="btn" id="diez">Medir 10</button>
  <div id="medida">—<small>elegí un modo y una página</small></div>
</div>

<script>
const frame = document.getElementById('frame');
const medida = document.getElementById('medida');
let datos = [], cache = {}, modo = 'imagen', pagina = 0;
let muestras = [];

function escalar() {
  const s = Math.min((innerWidth - 24) / 1920, (innerHeight - 120 - 24) / 1000);
  frame.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', escalar);

function pintar() {
  const p = datos[pagina];
  if (!p) return;
  if (modo === 'imagen') {
    frame.innerHTML = '<img src="' + p.imagen + '" alt="">';
  } else {
    const clave = p.pagina + '-' + modo;
    frame.innerHTML = cache[clave] || '';
    const pg = frame.querySelector('.pg');
    if (pg) {
      const s = 1000 / 1000;
      pg.style.transform = 'scale(' + s + ')';
    }
  }
}

function medir(etiqueta) {
  const t0 = performance.now();
  pintar();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ms = performance.now() - t0;
    muestras.push(ms);
    const p = datos[pagina];
    const peso = modo === 'imagen' ? p.pesoImagen : p.pesoFlu;
    const prom = muestras.reduce((a, b) => a + b, 0) / muestras.length;
    const max = Math.max.apply(null, muestras);
    let heap = '';
    if (performance.memory) heap = ' · heap ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB';
    medida.innerHTML = Math.round(ms) + ' ms <small>' + etiqueta + ' · peso ' + Math.round(peso / 1024) + ' KB' + heap +
      '<br>promedio ' + Math.round(prom) + ' ms · máximo ' + Math.round(max) + ' ms · n=' + muestras.length + '</small>';
  }));
}

async function arrancar() {
  datos = await (await fetch('medicion/indice.json', { cache: 'no-store' })).json();
  for (const p of datos) {
    cache[p.pagina + '-flujo'] = await (await fetch(p.flujo)).text();
    const im = new Image(); im.src = p.imagen;
  }
  escalar();
  pintar();
  medida.innerHTML = 'listo<small>elegí un modo o tocá una página</small>';
}

document.querySelectorAll('[data-modo]').forEach((b) => {
  b.onclick = () => {
    modo = b.dataset.modo;
    muestras = [];
    document.querySelectorAll('[data-modo]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    medir('modo ' + b.textContent);
  };
});
document.querySelectorAll('[data-pagina]').forEach((b) => {
  b.onclick = () => {
    pagina = Number(b.dataset.pagina);
    muestras = [];
    medir('página ' + datos[pagina].pagina);
  };
});
document.getElementById('diez').onclick = async () => {
  muestras = [];
  for (let i = 0; i < 10; i += 1) {
    await new Promise((r) => { medir('serie de 10'); setTimeout(r, 260); });
  }
};

addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { pagina = Math.min(datos.length - 1, pagina + 1); muestras = []; medir('página ' + datos[pagina].pagina); }
  if (e.key === 'ArrowLeft') { pagina = Math.max(0, pagina - 1); muestras = []; medir('página ' + datos[pagina].pagina); }
});

arrancar();
</script>
</body>
</html>
